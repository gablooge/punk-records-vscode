name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # the punk CLI the extension drives (needs `--json`, punk-records 0.4.0+)
      - run: pip install "punk-records @ git+https://github.com/gablooge/punk-records@main"
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - if: runner.os == 'Linux'
        run: npm run package
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
